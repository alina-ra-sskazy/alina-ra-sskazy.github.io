<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alina Ra/sskazy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="shortcut icon" type="image/x-icon" href="favicon.png">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#F6F6F4;
  --nav-bg:#ebebea;
  --text:#111;
  --muted:#777;
  --accent:#a23300;
  --accent-light:rgba(165, 44, 0, 0.07);
  --border:rgba(17,17,17,0.11);
  --nav-w:22%;
  --serif-title:'Playfair Display',Georgia,serif;
  --serif-body:'Source Serif 4',Georgia,serif;
  --sans:'Inter',system-ui,sans-serif;
  --tr:0.32s cubic-bezier(0.4,0,0.2,1);
}

[data-theme="dark"]{
  --bg:#1c1c1c;
  --nav-bg:#0E0E0E;
  --text:#EAEAEA;
  --muted:#888;
  --accent:#d9421d;
  --accent-light:rgba(212, 70, 35, 0.09);
  --border:rgba(234,234,234,0.09);
}

html,body{height:100%;overflow:hidden}

body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--serif-body);
  display:flex;
  transition:background var(--tr),color var(--tr);
}

/* ── DIAGONAL — right side, leans top-right → bottom-left ── */
body::before{
  content:'';
  position:fixed;
  top:-30%;
  right:6%;
  width:1.5px;
  height:180%;
  background:var(--accent);
  opacity:0.17;
  transform:rotate(14deg);
  transform-origin:top center;
  pointer-events:none;
  z-index:0;
}

/* ══════════════════════════════
   DESKTOP NAV
══════════════════════════════ */
nav{
  width:var(--nav-w);
  min-width:220px;
  height:100vh;
  position:fixed;
  top:0;left:0;
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:52px 0 44px;
  z-index:10;
  background:var(--nav-bg);
  transition:background var(--tr);
}

.nav-header{padding:0 40px 44px}

.site-title{
  font-family:var(--serif-title);
  font-size:24px;
  font-weight:900;
  letter-spacing:-0.03em;
  line-height:1;
  color:var(--text);
  transition:color var(--tr);
}
.site-title .slash{color:var(--accent)}

.site-tagline{
  font-family:var(--sans);
  font-size:10px;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--muted);
  margin-top:10px;
  transition:color var(--tr);
}

/* ── SOCIAL ICONS ── */
.nav-socials{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:18px;
}
.social-btn{
  background:none;border:none;cursor:pointer;
  padding:2px;
  color:var(--muted);
  transition:color var(--tr);
  display:flex;align-items:center;justify-content:center;
  text-decoration:none;
}
.social-btn:hover{color:var(--accent)}
.social-btn svg{
  width:15px;height:15px;display:block;
  fill:none;stroke:currentColor;
  stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;
}

/* ── STORY LIST with scroll fade hint ── */
.story-list-wrap{
  flex:1;
  position:relative;
  overflow:hidden;
  min-height:0;
}

/* fade-out at bottom to hint more content */
.story-list-wrap::after{
  content:'';
  position:absolute;
  bottom:0;left:0;right:0;
  height:64px;
  background:linear-gradient(to bottom,transparent,var(--nav-bg));
  pointer-events:none;
  z-index:2;
  transition:opacity 0.3s ease,background var(--tr);
}
.story-list-wrap.at-bottom::after{opacity:0}

.story-list{
  list-style:none;
  height:100%;
  overflow-y:auto;
  scrollbar-width:none;
  padding-bottom:48px;
}
.story-list::-webkit-scrollbar{display:none}

.story-item{
  padding:18px 40px;
  cursor:pointer;
  border-left:2px solid transparent;
  transition:border-color var(--tr),background var(--tr);
}
.story-item:hover .story-nav-title{color:var(--accent)}
.story-item.active{border-left-color:var(--accent);background:var(--accent-light)}
.story-item.active .story-nav-title{color:var(--accent)}

.story-nav-title{
  font-family:var(--serif-title);
  font-size:14.5px;
  font-weight:700;
  line-height:1.3;
  color:var(--text);
  transition:color var(--tr);
}

/* ── NAV FOOTER ── */
.nav-footer{
  padding:20px 40px 0;
  border-top:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:12px;
}

/* ── THEME TOGGLE (single icon, swaps) ── */
.theme-toggle{
  background:none;border:none;cursor:pointer;
  padding:2px;color:var(--muted);
  transition:color var(--tr);
  display:flex;align-items:center;
}
.theme-toggle:hover{color:var(--accent)}
.theme-toggle svg{
  width:16px;height:16px;display:block;
  fill:none;stroke:currentColor;
  stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;
}

/* light mode → show moon only */
.theme-toggle .icon-sun{display:none}
.theme-toggle .icon-moon{display:block}
/* dark mode → show sun only */
[data-theme="dark"] .theme-toggle .icon-sun{display:block}
[data-theme="dark"] .theme-toggle .icon-moon{display:none}

/* ══════════════════════════════
   MAIN / READING AREA
══════════════════════════════ */
main{
  margin-left:var(--nav-w);
  flex:1;
  height:100vh;
  overflow-y:auto;
  padding:76px 88px 120px 100px;
  position:relative;
  z-index:1;
  scrollbar-width:thin;
  scrollbar-color:var(--border) transparent;
}

/* ── SCROLL TO TOP ── */
.scroll-top{
  position:fixed;
  bottom:44px;
  right:52px;
  background:none;
  border:1px solid var(--border);
  color:var(--muted);
  cursor:pointer;
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.28s ease,color var(--tr),border-color var(--tr);
  z-index:20;
}
.scroll-top.visible{opacity:1;pointer-events:auto}
.scroll-top:hover{color:var(--accent);border-color:var(--accent)}
.scroll-top svg{
  width:14px;height:14px;display:block;
  fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
}

@media(max-width:800px){
  .scroll-top{bottom:24px;right:18px}
}

.story-content{
  max-width:650px;
  opacity:0;
  transform:translateY(16px);
  transition:opacity 0.42s ease,transform 0.42s ease;
  pointer-events:none;
  position:absolute;
}
.story-content.visible{
  opacity:1;transform:translateY(0);
  pointer-events:auto;position:relative;
}
.story-content.leaving{
  opacity:0;transform:translateY(-10px);position:absolute;
}

.story-meta{
  font-family:var(--sans);
  font-size:10px;font-weight:500;
  letter-spacing:0.16em;text-transform:uppercase;
  color:var(--accent);margin-bottom:30px;
}

.story-title{
  font-family:var(--serif-title);
  font-size:clamp(54px,6.5vw,84px);
  font-weight:900;line-height:0.93;
  letter-spacing:-0.04em;
  color:var(--text);margin-bottom:52px;
  transition:color var(--tr);
}

.story-body{
  font-family:var(--serif-body);
  font-size:17px;line-height:1.82;
  color:var(--text);max-width:570px;
  text-align: justify;
  transition:color var(--tr);
}
.story-body p+p{margin-top:1.4em}

.slash-divider{
  font-family:var(--serif-title);
  font-size:36px;font-weight:900;
  color:var(--accent);opacity:0.22;
  margin:60px 0;line-height:1;display:block;
  letter-spacing:-0.02em;
}

/* ══════════════════════════════
   MOBILE — hide by default
══════════════════════════════ */
.mobile-bar,.mobile-menu{display:none}

/* ══════════════════════════════
   MOBILE BREAKPOINT
══════════════════════════════ */
@media(max-width:800px){

  html,body{overflow:auto;height:auto}

  body::before{
    right:-10%;opacity:0.11;
    top:-10%;height:140%;
  }

  nav{display:none}

  /* ── TOP BAR ── */
  .mobile-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:fixed;
    top:0;left:0;right:0;
    height:54px;padding:0 18px;
    background:var(--nav-bg);
    border-bottom:1px solid var(--border);
    z-index:100;
    transition:background var(--tr),border-color var(--tr);
  }

  .mobile-site-title{
    font-family:var(--serif-title);
    font-size:17px;font-weight:900;
    letter-spacing:-0.03em;
    color:var(--text);transition:color var(--tr);
  }
  .mobile-site-title .slash{color:var(--accent)}

  .mobile-bar-right{display:flex;align-items:center;gap:0}

  .icon-btn{
    background:none;border:none;cursor:pointer;
    padding:8px;color:var(--muted);
    transition:color var(--tr);
    display:flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;
    min-width:40px;min-height:40px;
  }
  .icon-btn:active{color:var(--accent)}
  .icon-btn svg{
    width:18px;height:18px;display:block;
    fill:none;stroke:currentColor;
    stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;
  }

  /* mobile theme icons — same swap logic, scoped to .icon-btn */
  .icon-btn .m-icon-sun{display:none}
  .icon-btn .m-icon-moon{display:block}
  [data-theme="dark"] .icon-btn .m-icon-sun{display:block}
  [data-theme="dark"] .icon-btn .m-icon-moon{display:none}

  /* hamburger */
  .hbg{display:flex;flex-direction:column;gap:5px;width:18px}
  .hbg span{display:block;height:1.5px;background:currentColor;transition:transform 0.26s ease,opacity 0.2s ease}

  /* ── OVERLAY MENU ── */
  .mobile-menu{
    display:flex;
    flex-direction:column;
    position:fixed;inset:0;
    background:var(--nav-bg);
    z-index:200;
    padding-top:54px;
    transform:translateX(100%);
    transition:transform 0.36s cubic-bezier(0.4,0,0.2,1),background var(--tr);
  }
  .mobile-menu.open{transform:translateX(0)}

  .mobile-menu-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 20px 18px;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }

  .mobile-menu-label{
    font-family:var(--sans);
    font-size:9px;font-weight:500;
    letter-spacing:0.18em;text-transform:uppercase;
    color:var(--muted);
  }

  .close-btn{
    background:none;border:none;cursor:pointer;
    padding:6px;color:var(--muted);
    font-family:var(--sans);font-size:16px;
    -webkit-tap-highlight-color:transparent;
    transition:color var(--tr);
    min-width:36px;min-height:36px;
    display:flex;align-items:center;justify-content:center;
  }
  .close-btn:active{color:var(--accent)}

  /* scroll-hinting list wrapper inside menu */
  .mobile-list-wrap{
    flex:1;
    position:relative;
    overflow:hidden;
    min-height:0;
  }
  .mobile-list-wrap::after{
    content:'';
    position:absolute;
    bottom:0;left:0;right:0;
    height:72px;
    background:linear-gradient(to bottom,transparent,var(--nav-bg));
    pointer-events:none;
    z-index:2;
    transition:opacity 0.3s ease,background var(--tr);
  }
  .mobile-list-wrap.at-bottom::after{opacity:0}

  .mobile-story-list{
    list-style:none;
    height:100%;
    overflow-y:auto;
    scrollbar-width:none;
    padding:4px 0 64px;
  }
  .mobile-story-list::-webkit-scrollbar{display:none}

  .mobile-menu-footer{
    flex-shrink:0;
    padding:18px 20px;
    border-top:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:14px;
  }
  .mobile-menu-footer .social-btn svg{
    width:17px;height:17px;
  }

  .mobile-story-item{
    padding:15px 20px;
    cursor:pointer;
    border-left:3px solid transparent;
    transition:border-color var(--tr),background var(--tr);
    -webkit-tap-highlight-color:transparent;
  }
  .mobile-story-item:active{background:var(--accent-light)}
  .mobile-story-item.active{
    border-left-color:var(--accent);
    background:var(--accent-light);
  }
  .mobile-story-item.active .mobile-nav-title{color:var(--accent)}

  .mobile-nav-title{
    font-family:var(--serif-title);
    font-size:17px;font-weight:700;
    line-height:1.3;
    color:var(--text);transition:color var(--tr);
  }

  /* ── MAIN on mobile ── */
  main{
    margin-left:0;height:auto;
    padding:74px 22px 80px;
    overflow-y:visible;
  }

  .story-content,.story-content.visible{position:relative}

  .story-title{
    font-size:clamp(46px,12vw,68px);
    margin-bottom:36px;
  }

  .story-body{font-size:17px;line-height:1.78;max-width:100%}
}
</style>
</head>

const stories = [
  {
    slug:"zvezdochet",
    navTitle:"Звездочёт",
    title:"Звездочёт",
    meta:"Апрель 2025 / фантастика",
body:`<p>В школе все хотели в космос. И у них были шансы, это была хорошая школа. Лицей со вступительными экзаменами в девятом. Физико-математический класс, баскетбольная секция, хорошие оценки, здоровое тело — и прощай, гравитация. Никто не собирался прожить жизнь на Земле.</p><p>В последнее лето ездили с сестрой на трамвае прощаться с парками на окраинах. Было грустно и сладко, всё было в последний раз: просвеченные солнцем сосны и ковыль между рельсами, купание в грязноватых озёрах, малина со сметаной и сахаром. Катя должна была улетать зимой, он в сентябре; потом она-то уехала, а его медкомиссия оставила на Земле на два лишних года. Изоляция, тесты, тренажёрный зал, короткие разрешённые прогулки вокруг дома. Познакомился со всеми собачниками в районе. На всю жизнь насмотрелся на этот ковыль.</p><p>Личные вещи уместились в четыре металлических ящика размером с микроволновку. Плюс тридцатидвухдюймовый монитор — вещь дорогая, в космосе таких не выдают, и глаза жаль.</p><p>Заехала мама забрать кота. Домашних животных многие брали с собой, но коту было уже четырнадцать. Космические перелёты — не для кошачьего сердца. И справок на него собирать многовато.</p><p>Плакала, конечно.</p><p>— Скажи хотя бы, что будешь звонить.</p><p>— Конечно, буду, — подтвердил охотно. — Пообщаемся. Радиосигнал до Марса идёт от четырёх до двадцати минут. А до Юпитера от получаса до часа. А до “Вояджера-один”...</p><p>— Не ёрничай.</p><p>— Буду писать голосовые.</p><p>На взлёте в космическом корабле столько работы — проверка работоспособности систем, контроль за отделением ступеней, — а перед отлётом так загоняли инструктажами и подписанием всех бумаг, что посмотреть на Землю вспомнил только через полчаса. Она плыла в иллюминаторе, огромная, укрытая облаками, и уже не казалось, что она внизу.</p><p>В корабле не было много места. Проектировщики расположили всё, необходимое для жизни одинокому человеку, на двадцати квадратных метрах обитаемого отсека, четверть которых занимал пульт — и транспаристалевый иллюминатор от пола до потолка. Из четырёх ящиков личных вещей в шкафах удалось разместить три, оставшийся болтался под ногами. Ванная, маленькая, как в железнодорожном вагоне, всегда оказывалась залита водой в конце мытья, тот, кто это проектировал, никогда не пользовался ничем подобным. Зато между рабочей зоной и спальней была тонкая переборка, защищавшая от шума и света. И матрас был хороший.</p><p>Центр управления полётами называл это “разведывательной миссией”, но в анкете в отделе кадров значилось “постоянная релокация”. Должность — старший аналитик данных. По сути — скучное каталогизирование звёзд.</p><p>Он просиживал часы, изучая данные спектроскопии. Половина дня уходила на то, чтобы заполнить нудный, изобилующий графами журнал наблюдений, вторая половина — на расчёты по определению орбитальных периодов небесных тел. Бессмысленное дело, никто никогда не доберётся до этих звёзд — но он хотя бы не остался на Земле, как другие.</p><p>Рабочие программы закрывал минута в минуту по бортовым часам. Кофе — из бортового интегратора, мусор — в бортовой дезинтегратор, раз в неделю — выход в открытый космос, встретить курьерский беспилотник с припасами.</p><p>Новости перестал читать сразу, но включённый радиоприёмник оставлял даже в нерабочие часы. Иногда, если не мешал солнечный ветер, прорывались развлекательные передачи, или в эфир выходил кто-то с других кораблей. Земля ещё выделялась среди звёзд, ярким холодным огоньком; разреженного металлического облака покинувших её кораблей нельзя было разглядеть — слишком маленькие — но они оставались на связи. Почему-то говорить с ними было приятнее, чем с землянами.</p><p>Катя на лунной базе вышла замуж за американца и носила второго ребёнка. Серёга с параллели заканчивал облёт Марса в каких-то сорока миллионах километров отсюда — в школе они не общались, а тут приспособились каждый вечер играть в шахматы по радиоканалу. Звездолётчики поуспешнее уже вышли к внешним планетам Солнечной системы и вещали в эфире, как хорошо на спутниках Юпитера. Рассказы об Ио и Европе вызывали зависть, густо замешанную с тоскливым предчувствием: навигация в поясе астероидов была делом нелёгким, рискованным и требовала полного напряжения всех нервов на несколько недель подряд. Иначе можно было и размазаться по камню — и даже твоим именем его не назовут, за последние сорок лет там поименовали каждую песчинку. В сравнении с этим проблемы землян казались далёкими.</p><p>По вечерам смотрел фильмы из огромной бортовой видеотеки. Раз в неделю работал с психологом с Земли. Сначала жаловался на депрессию, дефицит внимания и притуплённые эмоции, думал, она скажет что-то такое, что поможет всё перевернуть в голове. Но месяцы шли, она ничего не говорила, зато он заметил, что всё, на что он жалуется вслух, постепенно проходит и перестаёт царапать.</p><p>Только перед входом в пояс астероидов спохватился, что уже давно не знает, какая светящаяся точка среди всех — Земля. Пришлось сканировать весь сектор корабельной оптикой.</p><span class="slash-divider">//</span><p>Мама позвонила, конечно, в самый неудобный момент, перекрыв окном интерфейса связи расчёты траектории.</p><p>— Что ты делаешь в сентябре?</p><p>Потребовалось время, чтобы вспомнить, что такое “сентябрь” — месяц под цифрой девять на приборной панели.</p><p>— Не знаю.</p><p>Полчаса на отправку сообщения на Землю, полчаса на получение ответа:</p><p>— Думай быстрее. Мне надо бронировать отпуск и брать билеты.</p><p>— Если переживу пояс астероидов, то буду пролетать мимо Юпитера.</p><p>— То есть если я приеду шестого, это нормально?</p><p>Полчаса на отправку сообщения:</p><p>— Мам. Это семьсот пятьдесят миллионов километров от Земли. О чём ты?</p><p>— Ну и что такого? В прошлом месяце открыли туристическую линию до самого Сатурна. Катя говорит, что там лучшие двигатели, и всё очень современно сделано.</p><p>Конечно, Катя так говорит, набрал досадливо. Подумал. Стёр.</p><p>— Мам, у меня тут напряжённый период на работе, давай потом поговорим.</p><p>В ответ через час:</p><p>— Я уже взяла билеты.</p><p>Этот поворот ситуации он осознавал медленнее, чем сообщение идёт до Земли и обратно: для него это был полёт в один конец, а для мамы — направление для отпуска. Пока осознавал, распихал по шкафам последний ящик вещей.</p><p>Мама прилетела в сентябре, с пересадкой на орбитальной платформе. На трапе попросила сфотографировать её так, чтобы было видно Юпитер в иллюминаторе и эмблему миссии, а потом обняла его и заплакала.</p><p>Привезла две сумки необходимых в космосе вещей: носки (мам, бортовой интегратор отлично делает носки), термобельё (мам, тут система жизнеобеспечения и постоянная температура), банный халат (примерь, как хорошо я его сшила, помню твой размер, а ты похудел) и кактус в горшке.</p><p>— Как ты его протащила? Сюда нельзя ввозить растения.</p><p>— Сказала, что искусственный, а они не проверяли, — пожала плечами и отправилась драить душевой блок (чем ты тут мыл? ничем. оно и видно).</p><p>Он уступил маме спальню за переборкой и ночевал на диване в рабочей зоне, в красно-оранжевом свете Юпитера. Мама готовила настоящую еду из ингредиентов, которые пронесла на борт контрабандой, ругалась с настройками бортового интегратора и спрашивала, можно ли слетать посмотреть на Ио, а то отпуск, а они и не видели ничего. Он был рад и одновременно не знал, куда себя девать. В мамином присутствии он сам себе начал казаться странным замкнутым типом, сбежавшим из дома, чтобы всю жизнь питаться в космосе синтезированным протеином.</p><p>Улетала она через две недели, курьерской шлюпкой до платформы на орбите, где её должен был подобрать регулярный рейс с Сатурна. Все две недели ему снились беспорядочные сны о сборах и документах, которые не в порядке, и космопорт дома — во сне стоявший в зелёном клеверном поле, совсем не с той стороны города, как в яви, и те неприятности, которые ждут его на Земле, когда выяснится, что он бросил миссию и вернулся.</p><p>Неловко и долго прощались в шлюзовой камере.</p><p>— Ну всё, давай, я пошла.</p><p>— Я через два года Сатурн буду пролетать. Там будет красиво. Кольца и всё такое. Ты начинай там бронировать отпуск…</p><p>Вернувшись, сел на неубранный диван. Сжавшаяся от маминого присутствия каюта постепенно расправлялась. Кактус в красном горшке скучал на приборной панели, загораживая собой индикатор уровня кислорода.</p><p>Включённое радио шептало голосами звёзд, и многие слова уже были понятны.</p>`  },
    {
    navTitle:"Проломленные крыши",
    slug:"kryshi",
    title:"Проломленные\nкрыши",
    meta:"Март 2025 / реализм",
    body:`<p>Утром двадцатого февраля снег лежал на крышах. Никто из нас три года такого не видел. Южный город, пальмы, порт, в парке камелии цветут, снег здесь лежит на вершинах гор. Пошли гулять и никуда не попали: воды под снегом оказалось по щиколотку, больше, чем снега. Такая ледяная смесь называется здесь “слаш” и продаётся в жару с лотков с добавлением фруктовой краски и цветного ароматизатора.</p><p>Двадцать первого снега стало достаточно, чтобы пройти куда угодно. Расплодились снеговики. Целая армия, в городе, на пляже, на чужих балконах, в парадной форме, накрашенные, с морковками, вёдрами и глазами-угольками. Пятиэтажная сосна, облепленная снегом, упала на стоявшую на тротуаре машину. В японском саду карпы плавали под слашем, едва шевеля плавниками. Снег таял и продолжал быть только потому, что шёл больше, чем таял.</p><p>Двадцать второго подтаявшие шапки созрели и стали падать с карнизов и балконов, глухо рассыпаясь внизу. Бахкает, каждый раз говорила Кира. Я каждый раз задерживала дыхание: раньше этим словом она называла работу ПВО.</p><p>Двадцать третьего поезд из Тбилиси встал в заносах, едва подъехав к побережью, и пять часов пробивался сквозь снег. Аэропорт закрыли ещё двадцатого.</p><p>Утром двадцать четвёртого Кира отдёрнула штору в размытый свет, сказала: ты сегодня никуда не попадёшь, посмотри. Метель оставила от города сугробы, в которых угадывались машины, сугробы, в которых угадывались дома, сугробы, в которых угадывался только снег. Ножом мы отхватили кусочек морковки, нагребли на балконном столе достаточно, чтобы слепить собственного снеговичка. В руках он был замёрзшей водой и кривился на бок.</p><p>Больше календарь никто не переворачивал.</p><span class="slash-divider">//</span><p>На второй день войны мы переставили все цветы с подоконника вниз, а окна заклеили скотчем, сложными геометрическими ритмами, чтобы хватило: купить больше скотча было нельзя. Окна заклеивают, чтобы разбитые стёкла не вылетали мелкими осколками. Долго думали, куда девать огромное зеркало, которое стояло среди цветов и умножало наши джунгли. Спрятали его в шкаф в коридоре, за шубами, отражающей поверхностью к несущей стене.</p><p>За цветы волновались: на полу холоднее, сквозняки, и меньше света. Но попадать с подоконников тоже не пошло бы им на пользу. На скотче от холода собирались капли воды. Прозрачный, в складках и пузырьках воздуха, он был как ломкий весенний лёд.</p><p>Через день на полу зацвёл высаженный в начале месяца нарцисс.</p><span class="slash-divider">//</span><p>Снег стирал город. Закрыли школы, отменили автобусы и поезда. Вода из крана шла с густой белой взвесью. Под стенами домов больше не ходили: снег сыпался с крыш, иногда вместе с крышами. Посреди улицы расчистили двойную колею, редкие пешеходы расходились в ней с редкими машинами без труда, как в средневековье. Мусор не вывозили.</p><p>Под весом мокрого снега ломались ветки и обрывались электрические провода. Рухнул навес над зданием аэропорта, прорвало парусиновый купол ночного клуба на берегу, навесов же над верандами и старых балконов упало без счёта. Никто не подумал, что такой снег — это не чистая белая ватка. Он тяжёлый, копится, давит сверху, и каждый день его всё больше. Тут такого не было то ли восемь, то ли все сорок лет.</p><p>От каждого удара снега в землю Кира вздрагивала — это у неё всегда было, и до войны тоже.</p><p>— Почему тебя так пугает шум?</p><p>— Я думаю, что что-то сломалось. Что-то красивое.</p><p>— Это просто снег. С карнизов сыплется. Он громкий сам по себе. А если он что-то сломал, то скорее всего — разбил кому-нибудь лобовуху за парковку в неположенном месте. Дыши. Не бойся.</p><p>— Не буду.</p><p>Ночью в частном доме в нашем дворе уставшая чёрная балка не выдержала и треснула, с грохотом ссыпала внутрь дома черепицу и тяжёлый мокрый снег. Стены внутри оказались голубыми. Утром мы подсчитывали, сколько зияющих провалов в укрытых белым крышах видно из наших окон. Напротив мужик голыми руками откапывал давно похороненную машину. Он начал делать это без всякого плана и уже понимал, что начал зря, но копал — то ли из упрямства, то ли чтобы не бросать на глазах у всей улицы. То ли знал, что лопаты у него нет всё равно.</p><span class="slash-divider">//</span><p>Всё закончится так же, как неделя зимы в южном городе: мы вылезем на балкон вешать постиранное бельё и ослепнем от солнца. Будет весна. Растает снег — кроме того, который сгребли в кучи и посыпали золой, чтобы быстрее таял. Мы будем ходить среди сугробов и щуриться, откуда-то вылезут голодные кошки, драные навесы станут трепаться на ветру, и всю весну мы будем чинить проломленные крыши.</p>`
  }
,
  {
    navTitle:"Что-то случилось",
    slug:"chtotosluchilos",
    title:"Что-то\nслучилось",
    meta:"Май 2024 / странное",
    body:`<p>— Сколько времени, Варь?</p><p>— Без пяти.</p><p>Мама сказала: посидим тихо, по-семейному, но было шумно. Телевизор показывал с флэшки вторую часть "Один дома", тётя Таня рассказывала маме про зимнюю рыбалку, дядя Коля в то же самое время — что для шампанского есть специальные штопоры, только их нигде не купить, мама отвечала обоим одновременно — подожди, я принесу полотенце, а что вы с рыбой делаете?</p><p>Варя протёрла сполоснутые бокалы бумажными салфетками, выставила их в ряд, проскользнула в кресло в углу. Дядя Коля — странно всё-таки называть дядей третьего тётиного мужа — раскрасневшийся, с расстёгнутой пряжкой ремня, поставил бутылку на стол и взялся за пульт, оборвав заснеженный Нью-Йорк. Мама вернулась с кухни с полотенцем и заново наполненной салатницей с оливье.</p><p>— Выключайте, пора… а, вы уже.</p><p>— Ещё не начинается.</p><p>— Может, они на этом канале не показывают?</p><p>— Новогоднее обращение показывают все каналы.</p><p>Дядя Коля носил за праздничным столом прокуренный тёмный свитер и всегда говорил весомо и основательно, даже если объяснял очевидные вещи.</p><p>Телевизор не стал петь песенку про пять минут, а вместо этого сказал женским голосом: “ни разу не видела, чтобы в тиндере писали…”, потом мужским:  “слушай, судя по его бородке, у него мачете есть…”, потом ехидно закончил: “перед приездом президента Южной Кореи в США всех собак от греха подальше спрятали”.</p><p>— Там у него просто такое обращение, — сказал Лёшка, набитый оливье рот придал ему бесстрашия. — Это был тяжёлый год, круче нас только яйца, всем спасибо за внимание. Короткое.</p><p>— Лёша, — сказала тётя Таня.</p><p>— Молчу…</p><p>Во дворе грохнул фейерверк. Варе не хотелось выбираться из кресла, с её места было видно только, как на соседних девятиэтажках мерцают розовые и зелёные отблески. Как северное сияние.</p><p>— Без двух минут. Фальстарт.</p><p>— Лёш, поищи на ютубе, выкладывали запись?</p><p>— Да нафиг он тебе нужен, — пробормотал Лёшка. Он ни разу ещё за вечер не выпустил телефона из рук, и было непонятно, стал он искать или нет. — Ты без него не можешь на часы посмотреть?</p><p>— Лё-ша. А куранты? А желание загадать? Что вот за манера у тебя вечно?</p><span class="slash-divider">//</span><p>Шампанское открыли по тёти Таниным наручным часам. Отвлеклись, звенели бокалами, чокались, поздравляли друг друга, Варя зажгла от свечки бенгальский огонь, мама стала снимать, Лёшка с запозданием включил на телефоне кремлёвские куранты, сменившиеся гимном.</p><p>— Это с прошлогодней записи. Свежей нет.</p><p>— Слушайте, может, мы всё перепутали просто? — хохотнула с бокалом в руке тётя Таня.</p><p>— Да, встали с утра и подумали: а давайте сегодня уже тридцать первое, не хочу на работу.</p><p>— Да, — смеялась тётя Таня, — и мы просто так без всякой причины посреди недели перепились, представь, Оль, вот это номер!</p><p>— И никто ничего не заметил.</p><p>В мамином смехе набухало сомнение, как будто она начала и правда откручивать день обратно, вдруг там потерялось с утра тридцатое декабря. Варя подала голос:</p><p>— Сегодня точно тридцать первое, у нас в кафе короткий день, мы закрылись в пять.</p><p>— А может, у нас часы переводили?</p><p>— Ты меня вечером в магазин за соком гоняла, мам. Там как раз все такие же умные подошли и очередь на полчаса.</p><span class="slash-divider">//</span><p>Часы у всех в доме показывали первое января, одиннадцать минут первого, и то же самое выдал Яндекс в ответ на “точное время”. Телевизор не показывал даже новогоднего концерта, обычная вечерняя сетка передач: шоу со звёздами, ток-шоу со звёздами, стендап. Никто не мог даже сказать, повтор это или нет. Тётя Таня перестала смеяться.</p><p>— Короче, — покачал головой дядя Коля, оставив людей в телевизоре дёргаться без звука, — что-то у них случилось, и они пока не знают, как нам про это сказать.</p><p>— Что случилось? Умер?</p><p>— Обращение же заранее записывают за пару дней, — возразила мама, — как раз бы поставили уж в эфир, если бы хотели скрыть, что умер.</p><p>— Может быть, у них там…</p><p>— Москва жива и на месте, я их видел только что, — сообщил Лёшка. — В запрещённой соцсети. Уже все селфи пьяные.</p><p>— Лёша, — сказала тётя Таня.</p><p>— Но это же чушь собачья. Они что, решили на всякий случай вообще ничего не показывать? Даже про Новый год не говорить?</p><span class="slash-divider">//</span><p>Варя два раза набрала и стёрла сообщение в чат с заголовком “чат чтобы орать”. Остановилась на таком: “кто-нибудь смотрел телевизор?” Онлайн никого не было. Варя прождала пару минут, глядя в экран.</p><p>— По московскому что-то объявят, — пообещал дядя Коля, вернувшись с балкона со свежим запахом дыма. — Чтобы всем одновременно.</p><p>— А как было в прошлый раз?</p><p>— В какой прошлый раз? — переспросила тётя Таня почему-то испуганно.</p><p>— Когда Ельцин ливнул с чата. Это, получается, Владивосток узнал первым? Или они сначала сказали в новостях, а потом красивый ролик показали?</p><p>Мама с тётей Таней переглянулись.</p><p>— Я не помню, — сказала мама. — А правда, интересно…</p><p>— Ты вспомни так, — подключилась Варя, — ты удивилась в полночь тридцать первого или раньше?</p><p>— А никто не звонил из Барнаула с криком “всё пропало, доллары покупай?”</p><p>— В полночь я была возмущена, что он не знает, когда начинается новое тысячелетие.</p><p>— А правда, — сказала тётя Таня, — почему из Барнаула нам ещё не оборвали телефон?</p><span class="slash-divider">//</span><p>Сеть была перегружена, с Барнаулом не соединяло, но как раз это так всегда и было, в каждый Новый год. Тётя Таня набросила шубу и ушла на балкон, ловить сигнал. Дядя Коля ушёл за ней. Мама сказала:</p><p>— Варёнок, поставь какую-нибудь новогоднюю музыку, а то у нас настроение, как на поминках.</p><p>— Вэпээн тоже дохлый, — сообщил Лёшка, — не грузит нифига. Но в твиттере вроде молчат.</p><p>В чате тоже молчали. Колонка запела “хэппи нью йер, хэппи нью йер”. Тётя Таня вернулась с балкона пободревшая, пронесла мимо Вари запах духов и стылый воздух.</p><p>— Ну их всех, Оль, с этой политикой. Сидеть страдать, что ли? У нас ещё шампанского полбутылки.</p><p>— Бежать никуда не надо, стол накрыт, — поддержал её муж. — Чего нам-то… мозги себе иметь, да? Пусть отрабатывают свою зарплату.</p><p>— Доллары мы всё равно уже не купили, — вздохнула мама.</p><p>— Лёш, брось телефон. Там торт в холодильнике.</p><p>— Ну ща…</p><p>— Ох, там у них сегодня веселье. Головы-то полетят всяко.</p><p>— Варя, что за тоска у нас играет? Поставь что-нибудь понятное.</p><span class="slash-divider">//</span><p>Из тёмного коридора выползла бабушка, держась рукой за стену, шурша ладонью по обоям, как змея в песке. Сощурилась на свет, выговорила неотменяемым своим учительским голосом:</p><p>— С Новым годом! Что-то вы дверями всё хлопаете, Танечка…</p><p>— С Новым годом, мама. Да я хотела дозвониться тёте Рае, но очень плохая связь. У нас почему-то президента не стали показывать, хотела узнать, что у них происходит.</p><p>Бабушка взялась за воротник ночнушки, охнула:</p><p>— Ужас-то какой, а что случилось? Что за страна-то такая, где мы живём… Господи, лишь бы не было…</p><span class="slash-divider">//</span><p>Закипятили чайник, поменяли музыку, бабушку стали усаживать и наливать воды, спохватились, что торт унесли из холодильника на балкон, потому что в холодильнике холодец. Варя, убираясь с дороги, встретила на подоконнике свой бокал с выдохшимися пузырьками. Допила, глядя в тёмное окно. Вспомнилось только теперь, что после самого первого не было больше ни одного салюта.</p><p>Часы показывали без пятнадцати час. Варя сказала никому:</p><p>— Я пойду спрошу у соседей, может, кто-то куда-то дозвонился…</p><p>Никто не услышал. В коридоре Варя сунула ноги в сапоги, накинула пуховик, всё не застёгивая. Четыре пролёта пробежала вниз мимо чужих дверей, молчавших или с музыкой, никуда не постучав. Кто-то должен быть на улице, это же самое простое, что можно сделать: выйти на улицу. Встретить людей. С кем-то поговорить.</p><p>На улице светились окна и оранжевые фонари, висели низкие облака, не было ни одной машины. Город дышал где-то далеко. Варя постояла у подъезда. Никто не шёл, даже снег. Застегнула все молнии. Пожалела на секунду: дверь надо было за собой закрыть, она только захлопнула. А с другой стороны, зачем? И пошла дальше.</p>`
  },
  {
    navTitle:"Семнадцать килограмм",
    slug:"17kilo",
    title:"Семнадцать\nкилограмм",
    meta:"Май 2024 / реализм",
    body:`<p>Кофе Кире приходится заваривать кипятком в маленькой стеклянной чашке с незабудками, потому что турки нет и где взять её, непонятно. В магазинах турки неправильные, со слишком широкими горлышками. У них тут всё время так: ничего нет и непонятно, где это брать. Косметика — в аптеке, резинки для волос — у тётки у метро, по одному лари. В новой квартире есть только кровати, диван, полуживой журнальный столик, пропечённый солнцем балкон, выходящий на дорожную развязку. Две чайных ложки, три тарелки, из них одна суповая. Нет даже ведра. Ни для мусора, ни помыть пол.</p><p>Ребята обещают:</p><p>— На Дезертирке за пару раз всё найдёшь. Там даже если чего-то нет, значит, есть за углом.</p><p>Во дворе тётушки переговариваются на напевном южном языке, из их разговоров Кира понимает только “ара, ара”. Ветер пахнет медленным школьным летом, горячей пылью и дровяным дымком. Женьке идти нельзя, ей хватает часа под этим солнцем, чтобы потом два дня сидеть с ледышкой на голове, а Кира лёгкая и жила в Крыму, она ныряет в день, как в закипающую кастрюлю с куриным бульоном.</p><p>Постельное белье берёт на развале в “Горгии”. Там нужно рыться в большой железной корзине, куда свалены без разбора разномастные наволочки и пододеяльники. Покупатели целыми днями перемешивают их в однородную массу, из которой не выловить полный комплект, поэтому одна наволочка акварельно-фиолетовая, вторая с розами, один пододеяльник чёрный, другой белый с ловцом снов. Август, так что хоть одеяла не нужны. А одну простыню на резинке отдали ребята, и она почти без треска натянулась на матрасы составленных рядом кроватей.</p><p>Кастрюлю дают в пункте помощи беженцам. Она последняя, с отбитой побуревшей эмалью, в пункте извиняются: только эта осталась, никто не берёт. Кира берёт и эту. Хватит, чтобы сварить яйца на окрошку.</p><p>За мусорным ведром, ножом и доской для резки овощей Кира сворачивает на Дезертирский рынок: кроссовки, кроссовки, учебники, веера, кастрюли — не надо, уже есть, — носки с хинкали, игрушечные машинки, сувенирные кинжалы, столовый хрусталь, неправильные турки с широкими горлышками, маленькие прищепочки с милыми кактусами, насадки для душа. Душный лабиринт  тянется на несколько кварталов, путается, как сон; неизвестным для Киры образом течение выносит к киоску у раскалённого побережья рынка, где есть ножи, графин для воды, и даже понятно, в какую сторону идти к метро. Во дворе тихо, гранатовое дерево свешивает через забор толстеющие плоды. Дома солнце сквозь шторы и болотный кондиционированный запах. Женька в одной футболке выглядывает из кухни.</p><p>— Господи, как ты по такой жаре таскаешь все эти сумки?</p><p>— Смотри, тебе чёрный пододеяльник, а мне белый. Если ты не против. Я сейчас ещё спущусь в “Никору”. Сковородок у волонтёров нет, на рынке непонятные, а нам бы хоть яичницу пожарить. И помидорчиков куплю.</p><p>Помидоры здесь дешёвые, мясистые, пахнут по-настоящему, и со сванской солью вкусные ужасно. Кира берёт сковородку по акции, ещё кофе, огурцы, помидоры, соль, подсолнечное масло — надо же, с нашего завода, — упаковку яиц, надписанную загадочными грузинскими рунами. Зависает над чайными кружками. Женька любит большие, чтобы чай не кончался никогда, пока она весь вечер печатает в ноутбуке. Себе Кира берёт красную, с надписью “USA”, ещё есть белые с цветными надписями. Кружки — трудная вещь, личная, всегда под рукой. Кира не может выбрать и берёт обе: белую и серую, парную к своей.</p><p>Женька забирает сумки и уходит шуршать ими на кухню босиком по холодному кафелю.</p><p>— Зачем нам целых три кружки?</p><p>— Не хотела выбирать. Решила взять две, чтобы были.</p><p>— А куда мы их потом будем девать?</p><p>Кира стряхивает нерасшнурованный кроссовок и идёт на кухню следом. Кружки выставлены в ряд на столе, как вещественные доказательства.</p><p>— Будет запасная для гостей.</p><p>Женька бросает разбирать сумку, забирается с ногами на табурет.</p><p>— У нас чемоданы уже по семнадцать килограмм, мы их еле дотащили. И постельное бельё потянет на третий.</p><p>— Выкинем.</p><p>— Выкинем?</p><p>— Это же просто кружки. Выбери, какая тебе меньше нравится, отдам соседке. Или я верну, у меня остался чек!</p><p>Непонятно, на каком языке её поймут в магазине,  но Кире уже не хочется никаких кружек, яичницы и колдбрю в новом графине.</p><p>— Ни одну не отдам, — Женька возит кулаком по лицу, — мне обе нравятся, Кир. Мне и дома нравились все кружки-и-и…</p><p>На улице плюс сорок, и рыдать в обнимку жарко.</p>`
  },
    {
    navTitle:"Голос",
    slug:"golos",
    title:"Голос",
    meta:"Февраль 2024 / странное",
    body:`<p>Когда он вошёл в кабинет, то сказать ничего не смог — вместо голоса у него получался то скрип, то шорох. Дали бумагу и ручку, не помогло: бумагу он комкал, хрипел, жалобно улыбался сквозь бившую его крупную нервную дрожь. Нарисовал в конце концов плачущую рожицу. Тогда Маргарита усадила его в кресло под лампы, приказала: откройте рот.</p><p>Под самыми гландами горло у него оказалось забито трепещущими от дыхания белыми перьями. Голубиными — у Маргариты на старом балконе голуби так вили гнёзда, кинут пару палочек и готово, можно откладывать яйца. Ветки царапали ему в горле изнутри, ссадины кровили. Пахло так, будто кто-то умер.</p><p>Маргарита приказала: пинцет.</p><p>Под ветками и перьями шла смерзшаяся мартовская грязь — хорошая такая, чернозёмная, — и газетная бумага, склеенная чем-то сладким в комки так, что уже не прочитать целиком ни одного заголовка. Только из-за щелей между комками он и дышал до сих пор.</p><p>Маргарита сказала: потерпите чуть-чуть, — и потянула на свет одно за другим: свалянный комок волос, мятую медицинскую маску, женский ноготь с нарисованным лаком сердечком, автомобильный ремень безопасности, немытую тарелку из-под гречки, фотографию с оторванным на треть краем, использованный презерватив, аттестат о среднем образовании, сушёный трупик мыши, длинную золотую цепочку, порванную на ладонь ниже застёжки…</p><p>Пациент дрожал, до скрипа впившись в подлокотники, сестра промокала ему салфеткой уголки глаз и лоб.</p><p>Последними вышли ветхие мальчишечьи шорты, протёртые на заднице до прозрачности; на них-то всё это и держалось, не провалилось в грудную клетку. Они, видимо, и были первыми забиты ему в горло — как в дымоход, который не планировали использовать.</p><p>Потом Маргарита мыла руки, а он надрывно кашлял. Выпил два стакана воды, прежде чем сумел извлечь голос из пыльного и ободранного горла.</p><p>— О Господи, — сказал он с большой буквы, — что же это такое... Спасибо вам, доктор...</p><p>— Что же вы так запустили, — упрекнула Маргарита, заполняя в карточке привычные графы. — В тридцать седьмой вот был случай, девушке резали всё от ключиц до челюстной кости, достали вот такую чушку… — показала, какую, разведя ладони. — Три с половиной кило шлака. Там уже всё так сплавилось, родная мать ни слова не поймёт.</p>`
  }
];

let current = -1;
let dark = false;
let transitioning = false;

/* ── SCROLL HINT: watch list scroll, remove fade when at bottom ── */
function initScrollHint(listEl, wrapEl) {
  function check() {
    const atBottom = listEl.scrollHeight - listEl.scrollTop <= listEl.clientHeight + 4;
    wrapEl.classList.toggle('at-bottom', atBottom);
  }
  listEl.addEventListener('scroll', check, {passive: true});
  // also check after content renders
  setTimeout(check, 100);
  return check;
}

/* ── RENDER NAV ── */
function renderDesktopNav(){
  const list = document.getElementById('desktopList');
  list.innerHTML = stories.map((s,i)=>`
    <li class="story-item${i===current?' active':''}" data-i="${i}">
      <span class="story-nav-title">${s.navTitle}</span>
    </li>`).join('');
  list.querySelectorAll('.story-item').forEach(el=>{
    el.addEventListener('click',()=>select(+el.dataset.i));
  });
  // recheck scroll hint after re-render
  checkDesktopScroll && checkDesktopScroll();
}

function renderMobileNav(){
  const list = document.getElementById('mobileList');
  list.innerHTML = stories.map((s,i)=>`
    <li class="mobile-story-item${i===current?' active':''}" data-i="${i}">
      <span class="mobile-nav-title">${s.navTitle}</span>
    </li>`).join('');
  list.querySelectorAll('.mobile-story-item').forEach(el=>{
    el.addEventListener('click',()=>{select(+el.dataset.i);closeMenu();});
  });
  checkMobileScroll && checkMobileScroll();
}

/* ── STORY ── */
function insertStory(s, container){
  const div = document.createElement('div');
  div.className = 'story-content';
  div.innerHTML = `
    <div class="story-meta">${s.meta}</div>
    <h1 class="story-title">${s.title.replace(/\n/g,'<br>')}</h1>
    <div class="story-body">${s.body}</div>`;
  container.appendChild(div);
  requestAnimationFrame(()=>requestAnimationFrame(()=>div.classList.add('visible')));
}

function renderStory(i){
  if(transitioning) return;
  const container = document.getElementById('storyContainer');
  const prev = container.querySelector('.story-content');
  if(prev){
    transitioning = true;
    prev.classList.add('leaving');
    prev.classList.remove('visible');
    setTimeout(()=>{
      if(prev.parentNode) prev.remove();
      insertStory(stories[i], container);
      transitioning = false;
    }, 300);
  } else {
    insertStory(stories[i], container);
  }
  document.getElementById('main').scrollTo({top:0,behavior:'smooth'});
  window.scrollTo({top:0,behavior:'smooth'});
}

function select(i, skipHash){
  if(i === current) return;
  current = i;
  if(!skipHash) history.replaceState(null,'','#'+stories[i].slug);
  renderDesktopNav();
  renderMobileNav();
  renderStory(i);
}

/* ── THEME ── */
function toggleTheme(){
  dark = !dark;
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : '');
  // gradient in fade hints uses --nav-bg; re-trigger check so it repaints correctly
  setTimeout(()=>{
    checkDesktopScroll && checkDesktopScroll();
    checkMobileScroll && checkMobileScroll();
  }, 350);
}

document.getElementById('desktopTheme').addEventListener('click', toggleTheme);
document.getElementById('mobileTheme').addEventListener('click', toggleTheme);

/* ── MOBILE MENU ── */
const mobileMenu = document.getElementById('mobileMenu');

function openMenu(){
  mobileMenu.classList.add('open');
  mobileMenu.setAttribute('aria-hidden','false');
  document.body.style.overflow = 'hidden';
  setTimeout(()=> checkMobileScroll && checkMobileScroll(), 50);
}
function closeMenu(){
  mobileMenu.classList.remove('open');
  mobileMenu.setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
}

document.getElementById('hamburger').addEventListener('click', openMenu);
document.getElementById('closeMenu').addEventListener('click', closeMenu);

/* ── SCROLL TO TOP ── */
const scrollTopBtn = document.getElementById('scrollTop');
const mainEl = document.getElementById('main');

function updateScrollTop(){
  scrollTopBtn.classList.toggle('visible', mainEl.scrollTop > 300 || window.scrollY > 300);
}
mainEl.addEventListener('scroll', updateScrollTop, {passive:true});
window.addEventListener('scroll', updateScrollTop, {passive:true});
scrollTopBtn.addEventListener('click', ()=>{
  mainEl.scrollTo({top:0,behavior:'smooth'});
  window.scrollTo({top:0,behavior:'smooth'});
});

/* ── INIT ── */
let checkDesktopScroll, checkMobileScroll;

function initFromHash(){
  const slug = window.location.hash.slice(1);
  const i = slug ? stories.findIndex(s => s.slug === slug) : -1;
  select(i >= 0 ? i : 0, true);
}

window.addEventListener('hashchange', ()=>{
  const slug = window.location.hash.slice(1);
  const i = slug ? stories.findIndex(s => s.slug === slug) : 0;
  if(i >= 0) select(i, true);
});

initFromHash();

// init scroll hints after first render
requestAnimationFrame(()=>{
  checkDesktopScroll = initScrollHint(
    document.getElementById('desktopList'),
    document.getElementById('desktopWrap')
  );
  checkMobileScroll = initScrollHint(
    document.getElementById('mobileList'),
    document.getElementById('mobileWrap')
  );
});
</script>
</body>
</html>
